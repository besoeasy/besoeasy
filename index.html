    <style>
      :root {
        --bg: #ffffff;
        color-scheme: light;
        --gray-900: #111827;
        --gray-700: #374151;
        --gray-600: #4b5563;
        --gray-200: #e5e7eb;
        --rose-500: #f43f5e;
        --r-block: 0;
        --r-ctrl: 0;
        --photo-border: rgba(0, 0, 0, 0.08);
        --photo-shadow: 0 20px 35px -15px rgba(0, 0, 0, 0.08);
        --status-dot: #16a34a;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        max-width: 100%;
        overflow-x: clip;
      }

      body {
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        background: var(--bg);
        color: var(--gray-900);
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        min-height: 100vh;
        min-height: 100svh;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        transition: background-color 0.3s ease, color 0.3s ease;
      }

      ::selection {
        background: var(--gray-200);
        color: var(--gray-900);
      }

      :focus-visible {
        outline: 2px solid var(--rose-500);
        outline-offset: 2px;
      }

      a {
        color: inherit;
        text-decoration: inherit;
      }

      img {
        max-width: 100%;
        height: auto;
      }

      svg {
        display: block;
        max-width: 100%;
      }

      /* Layout */
      .page {
        width: 100%;
        max-width: 48rem;
        min-width: 0;
        margin: auto;
        padding: 2.5rem 1.25rem 4rem;
        overflow-x: visible;
        overflow-wrap: break-word;
      }

      .hero {
        display: flex;
        flex-direction: column;
        gap: 2rem;
        width: 100%;
        max-width: 100%;
        min-width: 0;
        padding: 0;
      }

      /* Photo */
      .photo-frame {
        position: relative;
        width: 100%;
      }

      .photo-wrap {
        width: 100%;
        aspect-ratio: 1 / 1;
        border-radius: var(--r-block);
        overflow: hidden;
        border: 1px solid var(--photo-border);
        box-shadow: var(--photo-shadow);
        background: var(--gray-200);
      }

      .photo-wrap picture {
        display: block;
        width: 100%;
        height: 100%;
      }

      .photo-img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center;
      }

      .content {
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        gap: 1.5rem;
        width: 100%;
        min-width: 0;
        max-width: 100%;
        overflow-wrap: break-word;
      }

      .ident {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 0.75rem;
      }

      /* Name */
      .name-line {
        margin: 0;
        padding: 1.25rem 0 0;
        font-size: clamp(2rem, 8vw, 3.25rem);
        line-height: 1;
        font-weight: 800;
        letter-spacing: -0.05em;
        max-width: 100%;
        overflow-wrap: break-word;
      }

      /* Binary edge flow */
      .bin-edges {
        position: absolute;
        inset: 0;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 0.625rem;
        line-height: 1;
        color: var(--gray-600);
        pointer-events: none;
        user-select: none;
      }

      .bin-edges span {
        position: absolute;
        opacity: 0;
        transition: opacity 0.6s ease;
      }

      /* Social links */
      .email-row {
        display: flex;
        align-items: center;
        min-width: 0;
      }

      .email-row .social-link {
        gap: 0.65rem;
        font-size: 0.9375rem;
        font-weight: 500;
        letter-spacing: 0.01em;
        color: var(--gray-600);
      }

      .site-footer {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1.25rem;
        margin-top: 3rem;
        padding-top: 1.5rem;
        border-top: 1px solid var(--gray-200);
        text-align: center;
      }

      .footer-about {
        margin: 0;
        max-width: 38em;
        font-size: 0.875rem;
        line-height: 1.7;
        color: var(--gray-600);
        text-wrap: pretty;
        overflow-wrap: break-word;
      }

      .footer-about b {
        color: var(--gray-900);
        font-weight: 600;
      }

      .social-footer {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: center;
        gap: 1.125rem 1.5rem;
        min-width: 0;
        max-width: 100%;
      }

      .social-link {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 0.9375rem;
        font-weight: 600;
        color: var(--gray-600);
        white-space: nowrap;
        transition: color 0.2s ease;
      }

      .social-link:hover {
        color: var(--gray-900);
      }

      .social-icon {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        color: var(--icon-shade, var(--gray-600));
      }

      .social-icon svg,
      .social-link .email-label {
        flex-shrink: 0;
      }

      .social-icon svg {
        display: block;
      }

      .copy-status {
        font-size: 0.75rem;
        font-weight: 600;
        color: var(--status-dot);
        opacity: 0;
        transform: translateX(-4px);
        transition: opacity 0.2s ease, transform 0.2s ease;
      }

      .copy-status.is-copied {
        opacity: 1;
        transform: translateX(0);
      }

      /* Activity Section */
      .activity-section {
        width: 100%;
        min-width: 0;
        margin-top: 1.5rem;
        padding-top: 1.5rem;
        border-top: 1px solid var(--gray-200);
        text-align: center;
        opacity: 0;
        transition: opacity 0.4s ease;
      }

      .activity-section.is-visible {
        opacity: 1;
      }

      .activity-header {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 1rem;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 0.75rem;
      }

      .activity-kicker {
        display: inline-flex;
        align-items: center;
        gap: 0.45rem;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--gray-600);
      }

      .activity-kicker::before {
        content: "";
        width: 0.4rem;
        height: 0.4rem;
        background: var(--rose-500);
        flex-shrink: 0;
      }

      .activity-link {
        color: var(--gray-600);
        display: inline-flex;
        align-items: center;
        gap: 0.25rem;
        font-size: 0.75rem;
        font-weight: 500;
        text-decoration: none;
        transition: color 0.2s ease;
      }

      .activity-link:hover {
        color: var(--gray-900);
      }

      .activity-link svg {
        transition: transform 0.2s ease;
      }

      .activity-link:hover svg {
        transform: translate(2px, -2px);
      }

      .marquee {
        margin-top: 0.75rem;
        overflow: hidden;
        width: 100%;
        height: 6rem;
        -webkit-mask-image: linear-gradient(to bottom, transparent 0%, #000 10%, #000 88%, transparent 100%);
        mask-image: linear-gradient(to bottom, transparent 0%, #000 10%, #000 88%, transparent 100%);
      }

      .marquee-track {
        display: flex;
        flex-direction: column;
        width: 100%;
        animation: marquee-scroll var(--marquee-duration, 24s) linear infinite;
      }

      .marquee:hover .marquee-track {
        animation-play-state: paused;
      }

      .marquee-group {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.65rem;
        padding-bottom: 0.65rem;
        flex-shrink: 0;
      }

      .activity-item {
        display: flex;
        align-items: baseline;
        justify-content: center;
        gap: 0.6rem;
        max-width: 100%;
        padding: 0.25rem 0.5rem;
        font-size: 0.875rem;
        color: var(--gray-700);
        text-decoration: none;
        white-space: nowrap;
        transition: color 0.2s ease, background-color 0.2s ease;
      }

      .activity-item:hover {
        color: var(--gray-900);
        background: var(--gray-200);
      }

      .activity-tag {
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 0.75rem;
        font-weight: 600;
        color: var(--gray-900);
        white-space: nowrap;
      }

      .activity-title {
        color: inherit;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .activity-time {
        font-size: 0.8125rem;
        color: var(--gray-600);
        white-space: nowrap;
        font-variant-numeric: tabular-nums;
      }

      @keyframes marquee-scroll {
        from {
          transform: translateY(-50%);
        }
        to {
          transform: translateY(0);
        }
      }

      /* Responsive */
      @media (max-width: 480px) {
        .page {
          padding: 1.75rem 1rem 3.5rem;
        }
        .hero {
          gap: 1.5rem;
        }
        .content {
          gap: 1.25rem;
        }
        .marquee {
          height: 5.5rem;
        }
        .marquee-group {
          gap: 0.5rem;
          padding-bottom: 0.5rem;
        }
        .activity-item {
          gap: 0.4rem;
          font-size: 0.8125rem;
        }
        .activity-time {
          font-size: 0.75rem;
        }
        .site-footer {
          margin-top: 2.5rem;
        }
        .social-footer {
          gap: 0.875rem 1.125rem;
        }
        .social-link {
          font-size: 0.9375rem;
        }
      }

      @media (min-width: 640px) {
        .page {
          padding: 3rem 1.5rem 4rem;
        }
        .hero {
          gap: 2.5rem;
        }
      }

      @media (min-width: 768px) {
        .page {
          padding: 3.5rem 1.5rem 4rem;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .marquee-track {
          animation: none;
        }
        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>

  <body>
    <!-- Main -->
    <div class="page">

        <!-- Content -->

      <footer class="site-footer">

          Whatever I build, I make sure no one can hack it. That's why I focus on

      <!-- Activity Section -->
      <div class="activity-section" id="activity-section" hidden>

          <a class="activity-link" id="activity-link" href="https://blog.besoeasy.com" target="_blank" rel="noopener noreferrer">

    <script type="module">
      import * as lucide from "https://esm.sh/lucide@latest";
      const { createIcons } = lucide;

      // ── Social data ──────────────────────────────────────────────────
      const SOCIALS = [
        {
          name: "Github",
          url: "https://github.com/besoeasy?tab=repositories&q=&type=&language=&sort=stargazers",
          description: "Dive into my code, side projects, and experiments—steal ideas, get inspired, or just lurk 👀",
          lucide: "git-branch",
          shade: "#6b7280",
        },
        {
          name: "Nostr",
          url: "https://nosta.me/besoeasy@zaps.lol",
          description: "Find me on the decentralized side of the internet—uncensored thoughts and open conversations",
          lucide: "zap",
          shade: "#ca8a04",
        },
        {
          name: "Steam",
          url: "https://steamcommunity.com/id/besoeasy",
          description: "Games I play, hours I've lost, and maybe our next co-op session",
          lucide: "joystick",
          shade: "#3b82f6",
        },
        {
          name: "Instagram",
          url: "https://instagram.com/besoeasy",
          description: "Real life moments—if we've met or vibe, this is where we stay connected",
          lucide: "camera",
          shade: "#e11d48",
        },
        {
          name: "Telegram",
          url: "https://t.me/besoeasy",
          description: "Quick chats, random ideas, memes, or just say hi—I'm usually around here",
          lucide: "message-circle",
          shade: "#0d9488",
        },
        {
          name: "Mail",
          description: "Click to copy my email address",
          lucide: "mail",
          shade: "#f43f5e",
          copy: true,
          email: true,
        },
      ];

      const socialLinks = document.getElementById("social-links");
      const EMAIL_PARTS = [97, 64, 98, 101, 115, 111, 101, 97, 115, 121, 46, 99, 111, 109]; // obfuscated "a@besoeasy.com"
      const emailFrom = (parts) => parts.map((c) => String.fromCharCode(c)).join("");

      let emailFallback = emailFrom(EMAIL_PARTS);
      let copyFeedbackTimeout = null;

      function copyEmailToClipboard(e, statusEl) {
        const email = emailFallback;
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard
            .writeText(email)
            .then(() => {
              e.preventDefault();
              clearTimeout(copyFeedbackTimeout);
              statusEl.textContent = "(copied!)";
              statusEl.classList.add("is-copied");
              copyFeedbackTimeout = setTimeout(() => {
                statusEl.classList.remove("is-copied");
                setTimeout(() => {
                  statusEl.textContent = "";
                }, 200);
              }, 2000);
            })
            .catch(() => {
              // fallback: default anchor behavior
            });
        }
      }

      SOCIALS.forEach(({ name, url, description, lucide, shade, copy }) => {
        const a = document.createElement("a");
        a.className = "social-link";
        if (copy) {
          const statusEl = document.createElement("span");
          statusEl.className = "copy-status";
          statusEl.setAttribute("aria-live", "polite");
          a.href = "mailto:";
          a.addEventListener("click", (e) => copyEmailToClipboard(e, statusEl));
          a.innerHTML = `<span class="social-icon"><i data-lucide="${lucide}" style="width:18px;height:18px"></i></span><span class="email-label" id="email-value">${emailFallback}</span>`;
          a.appendChild(statusEl);
          document.getElementById("email-row").appendChild(a);
          return;
        }
        a.href = url;
        a.target = "_blank";
        a.rel = "noopener noreferrer";
        a.title = description;
        a.style.setProperty("--icon-shade", shade);
        a.innerHTML = `<span class="social-icon"><i data-lucide="${lucide}" style="width:18px;height:18px"></i></span><span>${name}</span>`;
        socialLinks.appendChild(a);
      });

      // Hydrate all data-lucide elements
      createIcons({ icons: lucide });

      // ── localStorage GET cache (15 min) ──────────────────────────────
      const CACHE_TTL_MS = 15 * 60 * 1000;
      const cacheKey = (url) => `besoeasy:cache:${url}`;

      function readCache(url) {
        try {
          const raw = localStorage.getItem(cacheKey(url));
          if (!raw) return null;
          const parsed = JSON.parse(raw);
          if (!parsed || !("timestamp" in parsed) || !("data" in parsed)) return null;
          return parsed;
        } catch {
          return null;
        }
      }

      function writeCache(url, data) {
        try {
          localStorage.setItem(cacheKey(url), JSON.stringify({ timestamp: Date.now(), data }));
        } catch {}
      }

      function isFresh(entry) {
        return entry && Date.now() - entry.timestamp < CACHE_TTL_MS;
      }

      async function fetchJsonCached(url, fetchOpts = {}) {
        const cached = readCache(url);
        if (isFresh(cached)) return cached.data;
        try {
          const res = await fetch(url, fetchOpts);
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          const data = await res.json();
          writeCache(url, data);
          return data;
        } catch (err) {
          if (cached) return cached.data;
          throw err;
        }
      }

      // ── IP Geolocation with Fallbacks ──────────────────────────────────
      async function fetchLocation() {
        const fetchTimeout = async (url) => {
          const cached = readCache(url);
          if (isFresh(cached)) return cached.data;
          const controller = new AbortController();
          const id = setTimeout(() => controller.abort(), 4000);
          try {
            const res = await fetch(url, { signal: controller.signal });
            if (!res.ok) throw new Error("HTTP error");
            const data = await res.json();
            writeCache(url, data);
            return data;
          } catch (err) {
            if (cached) return cached.data;
            throw err;
          } finally {
            clearTimeout(id);
          }
        };

        // Provider 1: ipwho.is
        try {
          const d1 = await fetchTimeout("https://ipwho.is/");
          if (d1.city && d1.latitude) return { city: d1.city, tz: d1.timezone?.id || d1.timezone, lat: d1.latitude, lon: d1.longitude };
        } catch (e) {}

        // Provider 2: ipinfo.io
        try {
          const d2 = await fetchTimeout("https://ipinfo.io/json");
          if (d2.city && d2.loc) {
            const [lat, lon] = d2.loc.split(",").map(Number);
            return { city: d2.city, tz: d2.timezone, lat, lon };
          }
        } catch (e) {}

        return null;
      }

      const locationPromise = fetchLocation();

      locationPromise.then((loc) => {
        if (loc && loc.city) {
          const slug = loc.city.toLowerCase().replace(/[^a-z0-9]/g, "");
          emailFallback = `${slug}@besoeasy.com`;
          const emailLabel = document.getElementById("email-value");
          if (emailLabel) emailLabel.textContent = emailFallback;
        }
      });

      // ── Binary snake along photo border ──────────────────────────────
      const photoFrame = document.querySelector(".photo-frame");
      const photoWrap = document.querySelector(".photo-wrap");
      const snakeLayer = document.querySelector("[data-snake]");
      const SNAKE_LEN = 14;

      let snakeSpans = [];
      let snakeSlots = 0;
      let snakeHead = 0;
      let snakeGeo = { w: 0, h: 0 };

      function snakeSlot(i, w, h) {
        const SLOT = 12;
        const OFF = 10; // center each bit just outside the border
        const d = ((i * SLOT) % (2 * (w + h)) + 2 * (w + h)) % (2 * (w + h));
        let x, y, rot = 0;
        if (d < w) { x = d; y = -OFF; }
        else if (d < w + h) { x = w + OFF; y = d - w; rot = 90; }
        else if (d < 2 * w + h) { x = 2 * w + h - d; y = h + OFF; rot = 180; }
        else { x = -OFF; y = 2 * (w + h) - d; rot = -90; }
        return { x, y, rot };
      }

      function snakeBuild() {
        const w = photoWrap.offsetWidth;
        const h = photoWrap.offsetHeight;
        if (!w || !h) return;
        snakeGeo = { w, h };
        snakeSlots = Math.floor(2 * (w + h) / 12);
        snakeLayer.innerHTML = "";
        snakeSpans = [];
        for (let i = 0; i < snakeSlots; i++) {
          const s = document.createElement("span");
          snakeLayer.appendChild(s);
          snakeSpans.push(s);
        }
        snakeRender();
      }

      function snakeRender() {
        const { w, h } = snakeGeo;
        for (let i = 0; i < snakeSlots; i++) {
          const dist = (snakeHead - i + snakeSlots) % snakeSlots;
          const span = snakeSpans[i];
          if (dist >= SNAKE_LEN) { span.style.opacity = "0"; span.textContent = ""; span.style.transform = ""; continue; }
          const { x, y, rot } = snakeSlot(i, w, h);
          span.textContent = Math.random() < 0.5 ? "0" : "1";
          span.style.transform = `translate(${x}px, ${y}px) translate(-50%, -50%) rotate(${rot}deg)`;
          span.style.opacity = String(1 - dist / SNAKE_LEN);
        }
      }

      function snakeStep() {
        snakeHead = (snakeHead + 1) % snakeSlots;
        snakeRender();
      }

      if (photoFrame && photoWrap && snakeLayer) {
        snakeBuild();
        if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
          snakeHead = 4;
          snakeRender();
        } else {
          setInterval(snakeStep, 180);
        }
        new ResizeObserver(() => snakeBuild()).observe(photoWrap);
      }

      // ── Activity Section (Writing) ──────────────────────────
      const activitySection = document.getElementById("activity-section");
      const marqueeTrack = document.getElementById("marquee-track");

      const allBlogItems = [];

      function escapeHtml(str) {
        return str.replace(/[&<>"']/g, (char) => ({
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          '"': "&quot;",
          "'": "&#39;",
        })[char]);
      }

      function timeAgo(iso) {
        const seconds = Math.floor((Date.now() - new Date(iso)) / 1000);
        if (seconds < 60) return "just now";
        const minutes = Math.floor(seconds / 60);
        if (minutes < 60) return `${minutes}m ago`;
        const hours = Math.floor(minutes / 60);
        if (hours < 24) return `${hours}h ago`;
        const days = Math.floor(hours / 24);
        if (days < 30) return `${days}d ago`;
        const months = Math.floor(days / 30);
        if (months < 12) return `${months}mo ago`;
        const years = Math.floor(days / 365);
        return `${years}y ago`;
      }

      function formatTag(str) {
        if (!str) return "Blog";
        if (str.length <= 3) return str.toUpperCase();
        return str.charAt(0).toUpperCase() + str.slice(1);
      }

      function renderMarquee() {
        if (!allBlogItems.length || !marqueeTrack) return;

        const group = document.createElement("div");
        group.className = "marquee-group";

        allBlogItems.forEach((item) => {
          const a = document.createElement("a");
          a.className = "activity-item";
          a.href = item.url;
          a.target = "_blank";
          a.rel = "noopener noreferrer";
          a.innerHTML = `
            <span class="activity-tag">${escapeHtml(item.tag)}</span>
            <span class="activity-title" title="${escapeHtml(item.title)}">${escapeHtml(item.title)}</span>
            <span class="activity-time">${timeAgo(item.date_published)}</span>
          `;
          group.appendChild(a);
        });

        const clone = group.cloneNode(true);
        clone.setAttribute("aria-hidden", "true");
        clone.querySelectorAll("a").forEach((a) => {
          a.tabIndex = -1;
        });

        marqueeTrack.innerHTML = "";
        marqueeTrack.append(group, clone);

        requestAnimationFrame(() => {
          const height = group.scrollHeight;
          const speed = 4; // px per second
          const duration = Math.max(40, height / speed);
          marqueeTrack.style.setProperty("--marquee-duration", `${duration.toFixed(1)}s`);
        });
      }

      function maybeShowActivity() {
        if (!allBlogItems.length) return;
        activitySection.hidden = false;
        requestAnimationFrame(() => activitySection.classList.add("is-visible"));
        createIcons({ icons: lucide });
      }

      async function loadBlog() {
        try {
          const data = await fetchJsonCached("https://blog.besoeasy.com/feed.json");
          const items = (data.items || []).map((item) => ({
            tag: formatTag(item.tags && item.tags[0] ? item.tags[0] : "Blog"),
            title: item.title || "",
            url: item.url || "https://blog.besoeasy.com",
            date_published: item.date_published,
          }));

          if (items.length) {
            allBlogItems.push(...items);
            renderMarquee();
            maybeShowActivity();
          }
        } catch (err) {}
      }

      loadBlog();
    </script>
  </body>
</html>
